# Edit this file before deploying. Lines beginning with # are comments.
# Start site must use HTTPS; website policies are preflight checks until WebView interception is integrated.
start_url=https://example.org/
allowed_host=example.org

# These are nonessential apps to close voluntarily before starting the exam.
blocked_process=chrome.exe
blocked_process=firefox.exe
blocked_process=discord.exe

# WFP is opt-in, administrator-only, and blocks full outbound traffic for
# explicitly named executable paths, not individual web domains.
# require_network_filter=true
# blocked_app_path=C:\\Program Files\\Example\\example.exe
require_network_filter=false
