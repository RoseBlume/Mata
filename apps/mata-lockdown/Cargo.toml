[package]
name = "mata-lockdown"
version = "0.1.0"
edition = "2024"
description = "Opt-in Windows exam browser prototype using Mata UI and native Windows APIs"

[dependencies]
mata-win = { path = "../../ui/mata-win", default-features = false }
mata-ui = { path = "../../ui/mata-ui", default-features = false, features = ["fonts", "webview"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_System_Rpc"
] }
