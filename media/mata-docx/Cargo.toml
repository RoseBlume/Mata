[package]
name = "mata-docx"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "DOCX/OOXML toolkit using Rust std plus the Mata font library"
keywords = ["docx", "ooxml", "word", "document", "zip"]
categories = ["parser-implementations", "text-processing"]

[lib]
name = "mata_docx"
path = "src/lib.rs"

[[bin]]
name = "mata-docx"
path = "src/bin/mata-docx.rs"
[[bin]]
name = "mata-docx-edit"
path = "src/bin/mata-docx-edit.rs"


[dependencies]
# When placed at Mata/core/mata-docx, this refers to Mata/media/mata-fonts.
mata-fonts = { path = "../../media/mata-fonts", default-features = false, version = "1.0.0" }

# Mata workspace image codec implementation; no FFI is called by mata-docx.
# JPEG/TIFF/PNG in sbix may be decoded without an OS image service.
mata-image = { path = "../../media/mata-image", default-features = false, features = ["jpeg", "tiff", "png"], version = "1.0.0" }
