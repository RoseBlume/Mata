name: std-only rust tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Confirm std-only crate
        shell: bash
        run: |
          cargo metadata --no-deps --format-version 1 > metadata.json
          python3 -c 'import json; p=json.load(open("metadata.json"))["packages"]; assert len(p)==1 and not p[0]["dependencies"]'
      - name: Build library, CLI and examples
        run: cargo build --all-targets --offline
      - name: Run all tests
        run: cargo test --all-targets --offline
      - name: Run generated example
        run: cargo run --example showcase --offline
      - name: Validate generated OOXML (Python stdlib)
        shell: bash
        run: python3 scripts/verify_package.py showcase.docx
  libreoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate DOCX
        run: cargo run --example showcase --offline
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils
      - name: Render document with LibreOffice
        shell: bash
        run: bash scripts/check_libreoffice.sh showcase.docx
