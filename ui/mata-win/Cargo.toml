[package]
name = "mata-win"
version = "1.0.0"
edition = "2024"
description = "Native windows, framebuffers, input events and presentation"
autoexamples = false

# Standard Win32 code must not be linked into a real AppContainer UWP binary.
# The UWP backend uses Rust std plus the Windows SDK C++/WinRT host.
[target.'cfg(all(target_os = "windows", not(target_vendor = "uwp")))'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"], optional = true }
x11rb = { version = "0.14.0", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", default-features = false, features = ["native-activity"] }
ndk = { version = "0.9", default-features = false, features = ["audio", "api-level-26"] }
ndk-context = "0.1"
jni = "0.22"
libc = "0.2"
num-derive = "0.4"
num-traits = "0.2"

[features]
default = ["wayland", "x11"]
wayland = ["dep:wayland-client", "dep:wayland-protocols"]
x11 = ["dep:x11rb"]
# Optional MIT-SHM transport for local X11 connections; regular X11 stays the default.
x11-shm = ["x11", "x11rb/shm"]
# Enable only for monitored builds; normal release/debug builds contain no telemetry.
telemetry = []

[package.metadata.mata]
role = "windowing-and-framebuffer-only"

# Only examples backed by the current native public API are exposed.

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "cursor_visibility"
path = "examples/cursor_visibility.rs"

[[example]]
name = "macos_metal"
path = "examples/macos_metal.rs"
