[package]
name = "mata-ui"
version = "0.1.0"
edition = "2024"
description = "Mata software widgets, layout, text, media and Servo webview"
autoexamples = false

[dependencies]
mata-doc-edit = { path = "../../media/mata-doc-edit" }
mata-i18n = { path = "../../core/mata-i18n", optional = true }
mata-win = { path = "../mata-win", default-features = false }
mata-fonts = { path = "../../media/mata-fonts", optional = true }
mata-image = { path = "../../media/mata-image", default-features = false, optional = true }
mata-audio = { path = "../../media/mata-audio", optional = true }
mata-video = { path = "../../media/mata-video", optional = true }
# Servo 0.7 software framebuffer backend; no GTK/WebKit/WebView2 dependency.
servo = { version = "=0.7.0", optional = true }
dpi = { version = "0.1", optional = true }
url = { version = "2", optional = true }
rustls = { version = "0.23", optional = true, features = ["aws_lc_rs"] }


[features]
i18n = ["dep:mata-i18n"]
default = ["wayland", "x11", "fonts", "audio", "image"]
wayland = ["mata-win/wayland"]
x11 = ["mata-win/x11"]
fonts = ["dep:mata-fonts", "dep:mata-image", "mata-image/png"]
audio = ["dep:mata-audio"]
image = ["dep:mata-image", "mata-image/all-formats", "mata-image/svg"]
video = ["dep:mata-video"]
webview = ["webview-servo"]
# The only HTML webview engine. It is not part of default feature set.
webview-servo = ["dep:servo", "dep:dpi", "dep:url", "dep:rustls"]

