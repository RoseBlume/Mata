name: Phase 3 Core Compute
on:
  push:
  pull_request:
jobs:
  rust-and-opencl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust baseline and no-default-features compatibility
        run: |
          cargo check --all-targets --all-features
          cargo check --all-targets --no-default-features
          cargo test --all-targets
      - name: Verify immutable intrinsic catalog
        run: |
          python3 tools/phase0_audit.py --check
          python3 tools/phase2_audit.py
      - name: Compile emitted OpenCL C 3.0 kernels with Clang
        run: python3 tools/phase3_compiler_smoke.py --require-opencl
