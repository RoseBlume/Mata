[package]
name = "mata-gpu-intrinsics"
version = "0.5.0"
edition = "2021"
rust-version = "1.70"
authors = []
description = "GPU-independent shader intrinsic catalog and function-pointer dispatch for AMD HIP, NVIDIA CUDA, Intel OpenCL, WGSL, GLSL and HLSL"
license = "MIT OR Apache-2.0"
keywords = ["gpu", "shader", "intrinsics", "wgsl", "hlsl"]
categories = ["graphics", "rendering", "no-std"]

[features]
default = ["std"]
std = []

[dependencies]
# Intentionally empty: no GPU, GPU SDK, driver, graphics crate, or device required to compile.
