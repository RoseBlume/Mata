[package]
name = "mata-req"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Synchronous HTTP client with rustls HTTPS, redirects, decompression and shared cookies"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls", "cookies", "gzip", "brotli", "deflate", "charset"] }
cookie_store = { version = "0.22", features = ["serde_json"] }
url = "2.5.8"
